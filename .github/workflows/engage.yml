name: engage
# Every five minutes: DMs the sources to anyone who comments SOURCE, and answers new comments on the last week's posts. Replies come from a no-tool model call and pass fixed checks.
on:
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  engage:
    if: vars.DESK_PAUSED != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # main as it is when the job starts, not the commit the run was queued on: a run that waited behind another
      # read the state from before that run's sends and posted the evening digest a second time (2026-11-27)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Tools
        run: npm install -g --silent @anthropic-ai/claude-code@2.1.319
      - name: Reply
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPLY_STATE_KEY: ${{ secrets.REPLY_STATE_KEY }}
        run: python3 -m aidaily engage
      - name: Commit
        if: always()
        run: |
          scripts/commit.sh "desk: replies $(date -u +%F-%H%M)"
