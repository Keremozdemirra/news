name: weekly
# Monday: read last month's numbers into category weights, extend the token, warn before it expires.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Insights and token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m aidaily insights
          python3 -m aidaily token
      - name: Commit
        if: always()
        run: scripts/commit.sh "desk: weekly $(date -u +%G-W%V)"
