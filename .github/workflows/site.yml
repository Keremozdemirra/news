name: site
# Rebuilds the news site (the address is desk.json site_url) when what the pages are made from changed. Publish runs finish hundreds of times
# a day; workflow_run alone stopped firing for them on 2026-11-27 (no run after 00:47 UTC, the site went 7 hours
# stale), so the tick also starts this every ten minutes with auto=yes. The live site carries a fingerprint of its inputs (built-from.txt), and a run whose fingerprint matches
# stops there. Static files only.
on:
  workflow_run:
    workflows: [daily, publish, weekly]
    types: [completed]
  workflow_dispatch:
    inputs:
      auto:
        description: "yes when the tick starts it: build only if the inputs changed, like a workflow_run"
        default: "no"
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # the status page lists the last runs
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Changed?
        id: changed
        run: |
          # tree ids are content hashes, so this works on a shallow checkout
          # the UTC date is part of the fingerprint: the daily games need one build after every midnight
          want=$( (git ls-tree HEAD queue state/insights state/followers.json state/markets.json aidaily assets-site games desk.json; date -u +%F) | sha1sum | cut -d' ' -f1)
          url=$(python3 -c 'import json; print(json.load(open("desk.json"))["site_url"])')
          live=$(curl -fsS --max-time 20 "$url/built-from.txt?t=$(date +%s)" || true)
          # /status/ must stay current while nothing else changes (a cooldown, a quiet night): rebuild hourly anyway
          age=$( (curl -fsS --max-time 20 "$url/status/status.json?t=$(date +%s)" || true) | python3 -c '
          import json, sys, datetime as d
          try: print(int((d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(json.load(sys.stdin)["generated"])).total_seconds() // 60))
          except Exception: print(9999)')
          echo "want=$want" >> "$GITHUB_OUTPUT"
          if { [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.auto }}" != yes ]; } || [ "$want" != "$live" ] || [ "$age" -ge 60 ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "site already up to date"
          fi
      - name: Media branch
        if: steps.changed.outputs.build == 'yes'
        run: scripts/media.sh pull
      - name: EIA reachability (status and time only, never the key)
        if: steps.changed.outputs.build == 'yes'
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          probe() { curl -sS -m 25 -o /dev/null -w "eia $1: http %{http_code} in %{time_total}s\n" "$2" || echo "eia $1: curl failed ($?)"; }
          probe root "https://api.eia.gov/v2/?api_key=$EIA_API_KEY"
          probe route "https://api.eia.gov/v2/petroleum/pri/spt/?api_key=$EIA_API_KEY"
          probe data_plain "https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=$EIA_API_KEY&data%5B0%5D=value&length=1"
          probe data_series "https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=$EIA_API_KEY&frequency=daily&data%5B0%5D=value&facets%5Bseries%5D%5B%5D=RBRTE&length=1"
      # the live sitemap before this deploy, so IndexNow is told only about pages that are new in it
      - name: Live sitemap
        if: steps.changed.outputs.build == 'yes'
        run: curl -fsS --max-time 20 "$(python3 -c 'import json; print(json.load(open("desk.json"))["site_url"])')/sitemap.xml" -o live-sitemap.xml || echo "no live sitemap"
      - name: Build
        if: steps.changed.outputs.build == 'yes'
        env:
          # the build starts from the committed state/markets.json and refreshes it; the EIA key is optional (the keyless dnav pages are the fallback)
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # CoinMarketCap free Basic key: coin prices for this build only (the site, never the social accounts); without it the coins are left out
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # the 1200x630 link-preview images are cut with ffmpeg, which the runner image does not ship
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          # the games' share images get the day's date drawn on (aidaily/play.py); pinned, and a build without it still ships the undated cards
          python3 -m pip install --quiet -r requirements-build.txt || echo "::warning::Pillow did not install; share images go out undated"
          python3 -m aidaily site
          python3 -m aidaily bsky-feed _site
          echo "${{ steps.changed.outputs.want }}" > _site/built-from.txt
      # report-only for now: a finding is shown in the run, it never holds the deploy
      - name: SEO audit
        if: steps.changed.outputs.build == 'yes'
        continue-on-error: true
        run: python3 -m aidaily seo _site | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.changed.outputs.build == 'yes'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # Pages' artifact lookup fails now and then ("No artifacts named github-pages"); a second try a little
      # later goes through, so one blip no longer fails the run and mails the owner
      - id: deploy
        if: steps.changed.outputs.build == 'yes'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      # A second miss is still a GitHub-side blip: the next run (minutes away) deploys again, and the health check
      # opens one issue if the live site falls hours behind. So it warns here instead of mailing the owner.
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy2.outcome == 'failure'
        run: echo "::warning::Pages deploy failed twice; the next site run retries"
      - name: IndexNow
        if: steps.deploy.outcome == 'success' || steps.deploy2.outcome == 'success'
        continue-on-error: true
        run: python3 -m aidaily indexnow _site live-sitemap.xml
  # Independent of publish.yml's own health step: that step cannot say "publish is not running". The tick starts this
  # workflow every ten minutes, so it is the second pair of eyes on the first. Red (an e-mail, and wf-site in the health
  # issue) when no publish run was created in the last 45 minutes and the desk is not paused.
  alive:
    if: vars.DESK_PAUSED != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: A publish run in the last 45 minutes
        run: |
          last=$(gh run list --workflow publish.yml --limit 1 --json createdAt --jq '.[0].createdAt // empty') || { echo "::warning::could not read the run list"; exit 0; }
          [ -n "$last" ] || { echo "::error::publish.yml has no runs"; exit 1; }
          age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          echo "last publish run $last (${age}s ago)"
          [ "$age" -le 2700 ] || { echo "::error::no publish run for $((age / 60)) minutes: the clock (tick.yml) may be down. Start it: gh workflow run tick.yml --ref main"; exit 1; }
