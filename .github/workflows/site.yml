name: site
# Rebuilds the news site (the address is desk.json site_url) when what the pages are made from changed. Publish runs finish hundreds of times
# a day; the live site carries a fingerprint of its inputs (built-from.txt), and a run whose fingerprint matches
# stops there. Static files only.
on:
  workflow_run:
    workflows: [daily, publish, weekly]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # the status page lists the last runs
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Changed?
        id: changed
        run: |
          # tree ids are content hashes, so this works on a shallow checkout
          want=$(git ls-tree HEAD queue state/insights state/followers.json state/markets.json aidaily assets-site desk.json | sha1sum | cut -d' ' -f1)
          url=$(python3 -c 'import json; print(json.load(open("desk.json"))["site_url"])')
          live=$(curl -fsS --max-time 20 "$url/built-from.txt?t=$(date +%s)" || true)
          # /status/ must stay current while nothing else changes (a cooldown, a quiet night): rebuild hourly anyway
          age=$( (curl -fsS --max-time 20 "$url/status/status.json?t=$(date +%s)" || true) | python3 -c '
          import json, sys, datetime as d
          try: print(int((d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(json.load(sys.stdin)["generated"])).total_seconds() // 60))
          except Exception: print(9999)')
          echo "want=$want" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$want" != "$live" ] || [ "$age" -ge 60 ]; then
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "site already up to date"
          fi
      - name: Media branch
        if: steps.changed.outputs.build == 'yes'
        run: scripts/media.sh pull
      - name: EIA reachability (status and time only, never the key)
        if: steps.changed.outputs.build == 'yes'
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          probe() { curl -sS -m 25 -o /dev/null -w "eia $1: http %{http_code} in %{time_total}s\n" "$2" || echo "eia $1: curl failed ($?)"; }
          probe root "https://api.eia.gov/v2/?api_key=$EIA_API_KEY"
          probe route "https://api.eia.gov/v2/petroleum/pri/spt/?api_key=$EIA_API_KEY"
          probe data_plain "https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=$EIA_API_KEY&data%5B0%5D=value&length=1"
          probe data_series "https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=$EIA_API_KEY&frequency=daily&data%5B0%5D=value&facets%5Bseries%5D%5B%5D=RBRTE&length=1"
      - name: Build
        if: steps.changed.outputs.build == 'yes'
        env:
          # the build starts from the committed state/markets.json and refreshes it; the EIA key is optional (the keyless dnav pages are the fallback)
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # the 1200x630 link-preview images are cut with ffmpeg, which the runner image does not ship
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          python3 -m aidaily site
          echo "${{ steps.changed.outputs.want }}" > _site/built-from.txt
      - if: steps.changed.outputs.build == 'yes'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # Pages' artifact lookup fails now and then ("No artifacts named github-pages"); a second try a little
      # later goes through, so one blip no longer fails the run and mails the owner
      - id: deploy
        if: steps.changed.outputs.build == 'yes'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      # A second miss is still a GitHub-side blip: the next run (minutes away) deploys again, and the health check
      # opens one issue if the live site falls hours behind. So it warns here instead of mailing the owner.
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - if: steps.deploy2.outcome == 'failure'
        run: echo "::warning::Pages deploy failed twice; the next site run retries"
