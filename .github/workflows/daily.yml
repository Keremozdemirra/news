name: daily
# Every hour: fetch, keep the important stories not posted yet, write their copy with a no-tool model
# call, render, queue them as single-story posts spaced 20 minutes apart, and open one veto issue.
# Nothing here can post: the Instagram token is not in this job.
on:
  schedule:
    - cron: "6,36 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  daily:
    if: vars.DESK_PAUSED != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # main as it is when the job starts, not the commit the run was queued on: a run that waited behind another
      # read the state from before that run's sends and posted the evening digest a second time (2026-11-27)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Tools
        run: |
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          npm install -g --silent @anthropic-ai/claude-code@2.1.319
      - name: Media branch
        run: scripts/media.sh pull
      - name: Run the day
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DESK_CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 -m aidaily daily
      - name: Push media
        run: scripts/media.sh push
      - name: Markets (official rates and prices; a failure here changes nothing)
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python3 -m aidaily markets
      - name: Commit the queue
        run: |
          scripts/commit.sh "desk: queue $(date -u +%F-%H%M)"
      - name: Open the veto issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESK_CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 -m aidaily notify
          scripts/commit.sh "desk: veto issue"
