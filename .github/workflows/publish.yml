name: publish
# Publishes queued carousels whose veto window has passed and whose issue is still open and unlabelled.
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: read   # the health step reads the run list
concurrency:
  group: desk
  cancel-in-progress: false
jobs:
  publish:
    if: vars.DESK_PAUSED != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          GITHUB_TOKEN: ${{ github.token }}
          DESK_CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export DESK_MEDIA_REF=$(git ls-remote origin refs/heads/media | cut -f1)
          python3 -m aidaily publish
      # Off unless desk.json growth.daily_reel is true: `reel due` then exits 1 and nothing below runs.
      - name: Daily reel
        if: always()
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DESK_CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if python3 -m aidaily reel due; then
            command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            scripts/media.sh pull
            if python3 -m aidaily reel build; then
              scripts/media.sh push
              export DESK_MEDIA_REF=$(git ls-remote origin refs/heads/media | cut -f1)
              python3 -m aidaily reel send
            fi
          fi
      # Off unless desk.json growth.shorts is true: `shorts due` then exits 1 and nothing below runs. The YouTube
      # secrets are given to this step alone; the token can upload videos (scope youtube.upload) and nothing else.
      - name: YouTube Short
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DESK_CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if python3 -m aidaily shorts due; then
            command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            [ -d media ] || scripts/media.sh pull
            python3 -m aidaily shorts run
          fi
      # what will not fix itself goes to one "Desk health" issue (opened, updated, closed by the check); never fails the run
      - name: Health
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m aidaily health
      - name: Commit
        if: always()
        run: |
          scripts/commit.sh "desk: publish $(date -u +%F-%H%M)"
